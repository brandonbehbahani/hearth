{% for peer in peers %}
<div class="peer-item" style="display: flex; align-items: center; gap: 8px;">
    <div style="flex-grow: 1; display: flex; justify-content: space-between; align-items: center;"
        title="{{ peer.onion_address }}">
        <span class="peer-nick">{{ peer.nickname }}</span>
        <span class="peer-status">●</span>
    </div>
    <button hx-delete="/peer/{{ peer.id }}" hx-target="#peer-list"
        style="background: #333; color: #ff5555; border: 1px solid #444; cursor: pointer; padding: 2px 6px; font-weight: bold; font-family: inherit;">
        X
    </button>
</div>
{% endfor %}
